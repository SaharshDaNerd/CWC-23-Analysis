<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CWC 2023 Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        /* Navbar */
        .navbar {
            background: #1a73e8;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        /* Title */
        h1 {
            text-align: center;
            margin: 30px 0 20px 0;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
        }

        .card a {
            text-decoration: none;
            font-weight: bold;
            color: #333;
            font-size: 18px;
        }

        /* Footer */
        footer {
            background: #1a73e8;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <div class="navbar">
        <h2>🏏 CWC 2023 Dashboard</h2>
        <div>
            <a href="/">Home</a>
            <a href="https://github.com/SaharshDaNerd/CWC-23-Analysis" target="_blank">GitHub</a>
        </div>
    </div>

    <!-- Page Title -->
    <h1>Explore World Cup Stats</h1>

    <!-- Grid of Plots -->
    <div class="grid">
        <div class="card"><a href="/plot/highest_avg">Highest Batting Averages</a></div>
        <div class="card"><a href="/plot/highest_sr">Highest Strike Rates</a></div>
        <div class="card"><a href="/plot/most_balls_country">Most Balls Faced (by Country)</a></div>
        <div class="card"><a href="/plot/most_boundaries">Most Boundaries</a></div>
        <div class="card"><a href="/plot/most_catches">Most Catches</a></div>
        <div class="card"><a href="/plot/most_fours">Most Fours</a></div>
        <div class="card"><a href="/plot/most_runs_country">Most Runs (by Country)</a></div>
        <div class="card"><a href="/plot/most_runs_for_country">Top Run Scorers for Each Country</a></div>
        <div class="card"><a href="/plot/most_runs">Most Runs</a></div>
        <div class="card"><a href="/plot/most_sixes">Most Sixes</a></div>
    </div>

</body>

</html>
